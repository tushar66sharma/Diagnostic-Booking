<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="580" viewBox="0 0 1100 580" role="img" aria-label="Booking state machine"><title>Booking state machine</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1100" height="580" fill="#ffffff"/><text x="40" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="start">Booking status transitions</text><text x="40" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">app/state_machine.py — every other transition is rejected with 409 Conflict</text><circle cx="45" cy="262" r="9" fill="#374151"/><path d="M54,262 H108" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><text x="24" y="222" font-family="'Cascadia Mono', Consolas, 'SFMono-Regular', Menlo, monospace" font-size="11.5" font-weight="400" fill="#111827" text-anchor="start">POST /bookings/</text><rect x="110" y="229" width="190" height="66" rx="33" fill="#fef3c7" stroke="#d97706" stroke-width="2"/><text x="205" y="261" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">PENDING</text><text x="205" y="281" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">awaiting payment</text><rect x="515" y="110" width="190" height="66" rx="33" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="610" y="142" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">CONFIRMED</text><text x="610" y="162" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">paid</text><rect x="515" y="350" width="190" height="66" rx="33" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/><text x="610" y="382" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">FAILED</text><text x="610" y="402" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">last payment failed</text><rect x="880" y="229" width="190" height="66" rx="33" fill="#f3f4f6" stroke="#9ca3af" stroke-width="2"/><text x="975" y="261" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#111827" text-anchor="middle">CANCELLED</text><text x="975" y="281" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">terminal</text><path d="M300,245 L513,150" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="341" y="166.5" width="113" height="19.5" fill="#ffffff" rx="3"/><text x="398" y="180" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">payment SUCCESS</text><path d="M300,280 L513,378" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="345" y="336.5" width="106" height="19.5" fill="#ffffff" rx="3"/><text x="398" y="350" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">payment FAILED</text><path d="M610,350 V178" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="617" y="254.5" width="154" height="19.5" fill="#ffffff" rx="3"/><text x="622" y="268" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="start">retry payment SUCCESS</text><path d="M705,150 L878,245" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="774" y="164.5" width="51" height="19.5" fill="#ffffff" rx="3"/><text x="800" y="178" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">cancel</text><rect x="713" y="184" width="173" height="18" fill="#ffffff" rx="3"/><text x="800" y="196" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="11" font-weight="400" fill="#4b5563" text-anchor="middle">(payment → refund_required)</text><path d="M705,380 L878,280" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="774" y="336.5" width="51" height="19.5" fill="#ffffff" rx="3"/><text x="800" y="350" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">cancel</text><path d="M205,295 V480 H975 V297" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="413" y="460.5" width="354" height="19.5" fill="#ffffff" rx="3"/><text x="590" y="474" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">cancel (also allowed while a payment is in flight)</text><text x="40" y="530" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">• Cancelling twice returns 200 (no-op) · cancelling or paying after the appointment time → 409</text><text x="40" y="552" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start">• Payment SUCCESS/FAILED are final: a late FAILED webhook can never move CONFIRMED back to FAILED</text></svg>
