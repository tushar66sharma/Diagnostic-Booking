<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1050" viewBox="0 0 1320 1050" role="img" aria-label="Payment and webhook sequence"><title>Payment and webhook sequence</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="1320" height="1050" fill="#ffffff"/><text x="40" y="46" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#111827" text-anchor="start">Payment + webhook flow — idempotency and locking</text><text x="40" y="72" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#4b5563" text-anchor="start">Example with simulate = &quot;pending&quot;; success/failed resolve in step ① directly</text><rect x="25" y="95" width="230" height="46" rx="10" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/><text x="140" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Client</text><path d="M140,141 V970" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 5"/><rect x="355" y="95" width="230" height="46" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/><text x="470" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">API (FastAPI)</text><path d="M470,141 V970" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 5"/><rect x="705" y="95" width="230" height="46" rx="10" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/><text x="820" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">PostgreSQL</text><path d="M820,141 V970" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 5"/><rect x="1055" y="95" width="230" height="46" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/><text x="1170" y="124" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#111827" text-anchor="middle">Payment provider (mock)</text><path d="M1170,141 V970" fill="none" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4 5"/><line x1="30" y1="160" x2="1290" y2="160" stroke="#d1d5db" stroke-width="1"/><text x="40" y="182" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="start">① Client pays for a booking</text><path d="M140,215 H466" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="90" y="192.5" width="429" height="19.5" fill="#ffffff" rx="3"/><text x="305.0" y="206" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">POST /payments/  {booking_id, simulate}   Idempotency-Key: k1</text><path d="M470,262 H816" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="478" y="239.5" width="333" height="19.5" fill="#ffffff" rx="3"/><text x="645.0" y="253" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">SELECT booking … FOR UPDATE   (not yours → 404)</text><path d="M470,309 H816" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="475" y="286.5" width="340" height="19.5" fill="#ffffff" rx="3"/><text x="645.0" y="300" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">key k1 already used? → return that payment (200)</text><path d="M470,356 H816" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="496" y="333.5" width="299" height="19.5" fill="#ffffff" rx="3"/><text x="645.0" y="347" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">payable? no payment in flight?  (else 409)</text><path d="M470,403 H1166" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="767" y="380.5" width="106" height="19.5" fill="#ffffff" rx="3"/><text x="820.0" y="394" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">charge(amount)</text><path d="M1170,440 H474" fill="none" stroke="#374151" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="691" y="417.5" width="258" height="19.5" fill="#ffffff" rx="3"/><text x="820.0" y="431" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">provider_ref = sim_…, status PENDING</text><path d="M470,487 H816" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="472" y="464.5" width="347" height="19.5" fill="#ffffff" rx="3"/><text x="645.0" y="478" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">INSERT payment (PENDING) · COMMIT → lock released</text><path d="M470,534 H144" fill="none" stroke="#374151" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="176" y="511.5" width="258" height="19.5" fill="#ffffff" rx="3"/><text x="305.0" y="525" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">201  {status: PENDING, provider_ref}</text><line x1="30" y1="565" x2="1290" y2="565" stroke="#d1d5db" stroke-width="1"/><text x="40" y="587" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="700" fill="#1d4ed8" text-anchor="start">② Provider reports the result — possibly many times, possibly concurrently</text><path d="M1170,625 H474" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="568" y="602.5" width="505" height="19.5" fill="#ffffff" rx="3"/><text x="820.0" y="616" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">POST /payments/webhook/   {event_id, provider_ref, status}   X-Signature</text><rect x="305.0" y="650" width="330" height="30" rx="6" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.2"/><text x="470" y="670" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#111827" text-anchor="middle">verify HMAC over the raw body → 401 if wrong</text><path d="M470,725 H816" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="444" y="702.5" width="402" height="19.5" fill="#ffffff" rx="3"/><text x="645.0" y="716" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">INSERT webhook_events … ON CONFLICT (event_id) DO NOTHING</text><rect x="420" y="748" width="850" height="72" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="5 4"/><text x="432" y="766" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="700" fill="#4b5563" text-anchor="start">if no row inserted (already seen)</text><path d="M470,804 H1166" fill="none" stroke="#374151" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="629" y="781.5" width="381" height="19.5" fill="#ffffff" rx="3"/><text x="820.0" y="795" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">ROLLBACK · 200 {result: &quot;duplicate&quot;} — nothing changes</text><path d="M470,862 H816" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="547" y="839.5" width="196" height="19.5" fill="#ffffff" rx="3"/><text x="645.0" y="853" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">SELECT booking … FOR UPDATE</text><path d="M470,909 H816" fill="none" stroke="#374151" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="489" y="886.5" width="312" height="19.5" fill="#ffffff" rx="3"/><text x="645.0" y="900" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">payment SUCCESS → booking CONFIRMED · COMMIT</text><path d="M470,956 H1166" fill="none" stroke="#374151" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><rect x="732" y="933.5" width="175" height="19.5" fill="#ffffff" rx="3"/><text x="820.0" y="947" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#111827" text-anchor="middle">200  {result: &quot;applied&quot;}</text><text x="40" y="1008" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">Event row and status change commit together: if processing fails, both roll back and the provider&#x27;s retry is processed normally.</text><text x="40" y="1030" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="400" fill="#4b5563" text-anchor="start" font-style="italic">A later contradicting event (FAILED after SUCCESS) → &quot;ignored_conflict&quot;; SUCCESS for a cancelled booking → refund_required.</text></svg>
